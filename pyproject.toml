[project]
name = "compressed_agent"
version = "0.1.0"
description = "A custom agent with virtual semantic compression"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "flask",
    "llmlingua>=0.2.2",
    "pydantic>=2.0.0",
    "python-toon>=0.1.3",
    "strands-agents>=1.17.0",
    "strands-agents-tools>=0.2.16",
    "tabulate>=0.9.0",
    "summa>=1.2.0",
    "wordfreq>=3.1.0",
    "spacy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest",
]
